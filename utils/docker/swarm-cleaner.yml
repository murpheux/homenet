version: "3.7"

services:
  swarm-cleanup:
    image: alpine:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: >
      sh -c "apk add --no-cache docker-cli && 
             docker container prune -f && 
             docker system prune -f"
    deploy:
      mode: global
      restart_policy:
        condition: none
