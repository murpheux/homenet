---
- name: Update all hosts (Arch and Debian family)
  hosts: servers
  become: true  # This is required to run tasks with root privileges
  gather_facts: true # Ensure facts are gathered to determine the OS

  tasks:
    - name: Update and upgrade apt packages (Debian/Ubuntu)
      ansible.builtin.apt:
        upgrade: 'yes'
        update_cache: true
        cache_valid_time: 86400 # optional: keep cache valid for 1 day
      when: ansible_facts["os_family"] == 'Debian'

    - name: Full system upgrade (Arch Linux)
      community.general.pacman:
        update_cache: true
        upgrade: true
      when: ansible_facts["os_family"] == 'Archlinux'

