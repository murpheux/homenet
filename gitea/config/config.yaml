log:
  level: "info"
runner:
  file: ".runner"
  capacity: 1
  envs:
    A_TEST_ENV_NAME_1: "a_test_env_value_1"
  env_file: ".env"
  timeout: "3h"
  fetch_interval: "2s"
  labels:
    - "ubuntu-latest:docker://gitea/runner-images:ubuntu-latest"
cache:
  enabled: true
  dir: "/tmp/cache"
container:
  network: "bridge"
  privileged: false
  valid_volumes: ["**"]
