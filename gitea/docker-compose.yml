# gitea

services:
  server:
    image: docker.gitea.com/gitea:1.26.2-rootless
    restart: always
    volumes:
      - /home/murpheux/HomeNet/gitea/server/data:/var/lib/gitea
      - /home/murpheux/HomeNet/gitea/server/config:/etc/gitea
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "3002:3000"
      - "2222:2222"

  runners:
    image: gitea/runner:latest
    restart: always
    depends_on:
      - server
    environment:
      CONFIG_FILE: /config.yaml
      GITEA_INSTANCE_URL: "${INSTANCE_URL}"
      GITEA_RUNNER_REGISTRATION_TOKEN: "${REGISTRATION_TOKEN}"
      GITEA_RUNNER_NAME: "${RUNNER_NAME}"
      GITEA_RUNNER_LABELS: "${RUNNER_LABELS}"
    volumes:
      - /home/murpheux/HomeNet/gitea/runners/config/config.yaml:/config.yaml
      - /home/murpheux/HomeNet/gitea/runners/data:/data
      - /var/run/docker.sock:/var/run/docker.sock